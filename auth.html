<html lang="en">

<body>
    <div class="wrapper">
        <a href="main.html">

        <main>
            <form action="https://httpbin.org/post" method="POST">
                <h2>Авторизация</h2>
                <label for="login">Логин</label>

                <input type="password" id="password" name="password" style="width: 300px;" placeholder="Введите пароль"
                    required>
                <label for="remember">
                    <input type="checkbox" id="remember" name="remember" required>
                    Запомнить меня
                </label>
                <button type="submit">Войти</button>
            </form>
        </main>
        <footer id="contacts">
            <p>Позвонить нам +7-000-000-00-00 (Абрамов Михаил 251-371)</p>
        </footer>
