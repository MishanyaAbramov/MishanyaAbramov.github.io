<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="formstyles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <a href="main.html">
        <h1>На главную</h1>
    </a>
    <main>
        <form action="https://httpbin.org/post" method="POST">
            <h2>Авторизация</h2>
            <label for="login">Логин</label>
            <input type="login" name="login" style="width: 300px;" placeholder="Введите логин" required>
            <label for="password">Пароль</label>
            <input type="password" name="password" style="width: 300px;" placeholder="Введите пароль" required>
            <label for="remember">
                <input type="checkbox" name="remember" required>
               Запомнить меня
            </label>
            <button type="submit">Войти</button>
        </form>
    </main>
</body>
